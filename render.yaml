services:
  - type: web
    name: xeno-assignment-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Add other env vars in Render dashboard:
      # DATABASE_URL, TENANT_ID, SHOPIFY_DOMAIN, SHOPIFY_ACCESS_TOKEN, etc.

